# Shared settings for every model. A model's own file in configs/models/
# can override any of these values.

seed: 0          # random seed, so runs can be repeated with the same result
model_args: {}   # settings passed to the model's build(); each model's yaml fills this in
device: cuda     # preferred device: "cuda" = NVIDIA GPU; falls back to "mps" (Mac GPU), then "cpu"

data:
  mayo_root: data/mayo   # folder holding the Mayo low-dose CT dataset

  # Patients used to train the models.
  # RULE: L506 is the locked test patient and must NEVER be listed here.
  train_patients: [L067, L096, L109, L143, L192, L286, L291, L310, L333]

  # Patients used for validation (only to watch the loss during training).
  # RULE: must NEVER contain L506.
  val_patients: [L333]
  val_every_kth_slice: 20   # use only every 20th slice so validation is quick
  context: 0                # k = also feed the k slices above and below as extra input
                            # channels (CoreDiff uses 1); the target is always the centre slice
  augment: false            # flip/rotate half of the training patches at random (CTformer does)

  # Held-out data used only for final testing, never for training.
  test_sets:
    mayo_L506:              # the locked Mayo test patient
      root: data/mayo
      patients: [L506]
    lits:                   # LiTS liver CT (simulated quarter dose), to test on unseen data
      root: data/lits
      patients:             # ONLY the locked test patients of the committed split
        split: configs/lits_split.json
        part: test
        prefix: lits_

train:
  epochs: 250               # number of full passes over the training data
  batch_size: 8             # images processed together in one step
  patch: 64                 # size (pixels) of the square crops cut from each image
  patch_n: 4                # number of crops cut from each image
  lr: 1.0e-3                # starting learning rate (how big each update step is)
  lr_min: 1.0e-6            # smallest learning rate the schedule decays to
  weight_decay: 0.02        # small penalty on large weights, to reduce overfitting
  betas: [0.9, 0.999]       # AdamW optimizer momentum settings
  workers: 4                # background processes that load data
  val_every: 5              # run validation every 5 epochs
  best_from_epoch: 1        # best.pth = lowest training loss among epochs >= this
                            # (raise it if the model's loss formula changes mid-training)
  max_steps_per_epoch: null # cap on steps per epoch (null = no cap; handy for quick tests)
  # Idea 1 (ldct/lesion.py), both off by default and only active for slices that have a mask:
  lesion_weight: null       # e.g. 5.0 = tumour pixels count 5x in the L1 loss
  lesion_extra_scale: 1.0   # for models with their own loss: loss + scale * weighted L1
  tumour_patch_share: 0.0   # e.g. 0.5 = half the patches of a tumour slice are centred on a tumour
  extra_train_sets: []      # more (root, patients) pairs to train on, e.g. LiTS train patients
                            #   - {root: data/lits, split: configs/lits_split.json, part: train}

infer:
  patch: null               # crop size at test time (null = process the whole image at once)
  stride: 32                # step between crops when patch is set (smaller = more overlap)
  batch: 64                 # crops processed together at test time

eval:
  window: [-160, 240]       # HU range used for PSNR/SSIM/RMSE (soft tissue), as in CT-Mamba

output_dir: runs            # where checkpoints, logs and predictions are saved (not in git)
results_dir: results        # where summary.csv is written (committed to git)
